# Perfil docker: usa MySQL levantado por docker-compose.
spring:
  datasource:
    url: jdbc:mysql://mysql:3306/catalogdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: catalog_user
    password: catalog_password
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
